<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helper</title>
  <link rel="stylesheet" href="/helper.css?v=stable3" />
</head>
<body>
  <main class="helper-wrap">
    <section id="login" class="panel">
      <h1>Assistant</h1>
      <p class="muted">Join the private room as listener. Your mic is never requested.</p>
      <label>Room <input id="roomInput" autocomplete="off" autocapitalize="none" /></label>
      <label>Secret key <input id="keyInput" type="password" autocomplete="off" /></label>
      <button id="connectBtn" type="button">Join Audio Room</button>
      <p id="loginStatus" class="status disconnected">Disconnected</p>
    </section>

    <section id="assistantPanel" class="panel hidden">
      <div class="top-row">
        <div>
          <h1>Live Note</h1>
          <p id="status" class="status disconnected">Disconnected</p>
          <p id="audioStatus" class="call-status">Audio not receiving yet.</p>
        </div>
        <button id="resetAudioBtn" type="button" class="small-btn">Reset Audio</button>
      </div>

      <textarea id="noteEditor" spellcheck="false"></textarea>
      <p class="hint">Edits sync immediately to the performer screen.</p>
    </section>
  </main>

  <script src="/helper.js?v=stable3"></script>
</body>
</html>
