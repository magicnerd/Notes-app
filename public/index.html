<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Performance App</title><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="topbar"><div class="brand">Notes Performance App</div><button onclick="logout()">Log out</button></div><section id="auth" class="card"><h1>Sign in</h1><p>Create an account, enter the activation code, then make private performance rooms.</p><input id="email" placeholder="Email"><br><br><input id="password" type="password" placeholder="Password"><br><br><input id="code" placeholder="Activation code, for signup"><br><br><div class="row"><button class="primary" onclick="signup()">Create account</button><button onclick="login()">Log in</button></div><p id="msg" class="status"></p></section><section id="dash" class="hidden"><h1>Dashboard</h1><p>Logged in as <span id="userEmail"></span></p><div id="activation" class="card hidden"><h2>Activate access</h2><p>Enter the code from the tutorial video.</p><input id="activateCode" placeholder="Activation code"><br><br><button class="primary" onclick="activate()">Activate</button><p id="activateMsg" class="status bad"></p></div><div id="roomsBlock" class="hidden"><div class="row"><h2>Your rooms</h2><button class="primary" onclick="createRoom()">Create room</button></div><div id="rooms" class="grid"></div></div></section></div><script src="/app.js"></script></body></html>
