<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Notes</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css?v=stable3" />
</head>
<body>
  <section id="setup" class="setup-screen">
    <div class="setup-card">
      <h1>Performance setup</h1>
      <p class="setup-copy">Microphone audio will be sent to your private helper after you confirm. Start this before the performance.</p>
      <label>Room code
        <input id="roomInput" autocomplete="off" autocapitalize="none" />
      </label>
      <label>Starting note
        <textarea id="prefillInput" rows="5" placeholder="Blank note"></textarea>
      </label>
      <button id="armBtn">Allow Microphone and Open Notes</button>
      <p id="setupStatus" class="setup-status">Not connected.</p>
    </div>
  </section>

  <main id="notesList" class="notes-list hidden">
    <header class="list-header">
      <div class="folder-row">‹ Folders</div>
      <div class="list-title-row">
        <h1>Notes</h1>
        <span class="ellipsis">•••</span>
      </div>
      <div class="search-pill">Search</div>
    </header>

    <section class="notes-table" aria-label="Notes list">
      <button id="currentNoteRow" class="note-row" type="button">
        <div class="row-title" id="currentRowTitle">New Note</div>
        <div class="row-preview" id="currentRowPreview">No additional text</div>
      </button>
      <button class="note-row dummy-note" type="button" data-title="Ideas" data-body="Film backyard photo challenge\n\n- Rain on leaves\n- Low angle shadows\n- Bottle reflection">
        <div class="row-title">Ideas</div>
        <div class="row-preview">Film backyard photo challenge</div>
      </button>
      <button class="note-row dummy-note" type="button" data-title="Gym" data-body="Legs\n\nSmith squats\nRDLs\nCalves\nStretch hips">
        <div class="row-title">Gym</div>
        <div class="row-preview">Legs, RDLs, calves</div>
      </button>
      <button class="note-row dummy-note" type="button" data-title="Books" data-body="To read\n\nAtomic Habits\nDeep Work\nThe War of Art">
        <div class="row-title">Books</div>
        <div class="row-preview">To read</div>
      </button>
      <button class="note-row dummy-note" type="button" data-title="Packing" data-body="Hike packing\n\nHeadtorch\nRain jacket\nBattery bank\nFirst aid">
        <div class="row-title">Packing</div>
        <div class="row-preview">Headtorch, rain jacket</div>
      </button>
    </section>

    <footer class="list-footer">
      <span>5 Notes</span>
      <span class="compose-icon">□</span>
    </footer>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>

  <main id="notesApp" class="notes-app hidden">
    <header class="notes-header">
      <button id="backToListBtn" class="back-btn" aria-label="Back" type="button">‹ Notes</button>
      <button id="doneBtn" class="done-btn" type="button">Done</button>
    </header>

    <section class="note-sheet">
      <input id="noteTitle" class="note-title" aria-label="Note title" placeholder="" />
      <textarea id="noteBody" class="note-body" aria-label="Note body"></textarea>
    </section>

    <div id="hiddenLockZone" class="hidden-lock-zone" aria-hidden="true"></div>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>

  <div id="blackout" class="blackout hidden" aria-hidden="true"></div>

  <script src="/performer.js?v=stable3"></script>
</body>
</html>
