<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Notes</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <section id="setup" class="setup-screen">
    <div class="setup-card">
      <h1>Performance setup</h1>
      <p class="setup-copy">Microphone audio will be sent to your private helper after you confirm. Start this before the performance.</p>
      <label>Room code
        <input id="roomInput" autocomplete="off" autocapitalize="none" />
      </label>
      <label>Starting note
        <textarea id="prefillInput" rows="5">Shopping list

- Milk
- Bread
- Coffee</textarea>
      </label>
      <button id="armBtn">Allow Microphone and Open Notes</button>
      <p id="setupStatus" class="setup-status">Not connected.</p>
    </div>
  </section>

  <main id="notesApp" class="notes-app hidden">
    <header class="notes-header">
      <button class="back-btn" aria-label="Back">‹ Notes</button>
      <button class="done-btn">Done</button>
    </header>

    <section class="note-sheet">
      <input id="noteTitle" class="note-title" aria-label="Note title" />
      <textarea id="noteBody" class="note-body" aria-label="Note body"></textarea>
    </section>

    <div id="hiddenLockZone" class="hidden-lock-zone" aria-hidden="true"></div>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>

  <div id="blackout" class="blackout hidden" aria-hidden="true"></div>

  <script src="/performer.js"></script>
</body>
</html>
